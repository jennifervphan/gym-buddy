# Checks only. Deployment is handled by Netlify's Git integration.
#
# The test guard lives in netlify.toml's build command, which runs `npm run
# check` before building — so a red build fails the deploy rather than shipping.
# This workflow reports the same checks on pull requests, where Netlify's build
# is not the thing you are reading.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc -b && oxlint && vitest run
      - run: npm run check

      # Catches anything that only breaks in a production build.
      - run: npm run build
