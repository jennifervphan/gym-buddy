# Netlify builds and deploys from Git — every push to main ships.
#
# The build command runs the checks first, so the tests genuinely guard the
# deploy: if typecheck, lint or any test fails, the build fails and the live
# site keeps serving the last good deploy. GitHub Actions reports the same
# checks on pull requests, but it is this command that gates what ships.
#
# Response headers and redirects live in public/_headers and public/_redirects,
# which Vite copies into dist/ so they ship inside the publish directory.

[build]
  command = "npm run check && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
