# Build settings only.
#
# Deploys are driven by .github/workflows/ci.yml, which deploys the built site
# with the Netlify CLI only after typecheck, lint and tests pass. Netlify's own
# automatic Git builds should be switched off (Site configuration → Build &
# deploy → Continuous deployment → Stop builds), otherwise Netlify would also
# build on push and bypass that gate.
#
# This section is kept so a Netlify-side build still works correctly if
# automatic builds are ever turned back on.
#
# Response headers and redirects live in public/_headers and public/_redirects,
# so they ship inside the publish directory and apply to either deploy path.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
